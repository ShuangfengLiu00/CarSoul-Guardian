[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carsoul-schema"
version = "1.0.0"
description = "CarSoul OS Vehicle Schema — public data standard (Pydantic v2 + JSON Schema)"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "."}
packages = ["vehicle_schema", "simulator"]
