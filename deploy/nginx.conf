# ====================================================
# CarSoul Guardian — 前端生产反向代理配置
# ====================================================
# 用途：把 build 产物（frontend/dist）作为静态站点托管，并把三类后端 surface
#       反代到对应服务，使「生产环境」与「vite dev proxy」行为一致。
#
# 解决的问题（来自 2026-08-09 前端连通性审计）：
#   1. SPA 深链 404 —— 直接访问 /knowledge、/life 等路由时静态服务器找不到文件。
#   2. portal 外链失真 —— /docs、/cockpit/ 在纯静态托管下要么 404，要么被 SPA
#      fallback 静默吞掉跳回 Dashboard（「假成功」，比 404 更危险）。
#
# ⚠️ 顺序很重要：所有 proxy 的 location 必须在 `location /` 之前生效，
#    否则会被 SPA fallback 抢先吃掉。nginx 的 `=` 精确匹配和 `^~` 前缀匹配
#    优先级高于普通前缀匹配，下面已按此规则编排，不要随意调整。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- 基础 ----
    charset utf-8;
    client_max_body_size 20m;

    # 前端主 bundle 约 2MB（gzip 后 ~630KB），gzip 收益显著
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # ---- 上游地址 ----
    # 用「变量 + resolver」而非直接写死主机名，是刻意为之：
    # nginx 对 proxy_pass 里的字面主机名会在【启动时】做一次性解析，若 carmodel
    # 容器不存在，nginx 会直接启动失败 —— 那等于「预测引擎没起，整个前端跟着挂」。
    # 改成变量后解析推迟到请求时，carModel 缺席只会让那几个外链返回 502，
    # 前端主站照常可用。127.0.0.11 是 Docker 内置 DNS。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $guardian_upstream "http://guardian-backend:8001";
    set $carmodel_upstream "http://carmodel:8000";

    # ---- 通用代理头 ----
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;   # Agent 对话可能较慢，与前端 axios timeout 30s 留余量

    # ================================================
    # 1) Guardian 后端 (:8001)
    # ================================================

    # 前端全部业务请求都走 /api 前缀（后端 api_router prefix="/api"，无 /v1）
    location ^~ /api/ {
        proxy_pass $guardian_upstream$request_uri;
    }

    # Guardian 自身存活探针（backend/app/main.py 的 @app.get("/health")）
    # 用 `=` 精确匹配：普通前缀匹配会把 /healthz、/health-check 一起吃掉。
    location = /health {
        proxy_pass $guardian_upstream/health;
    }

    # ================================================
    # 2) carModel 车辆世界模型引擎 (:8000)
    # ================================================
    # 注意 /docs 与 /openapi.json 必须【成对】反代到同一上游：
    # FastAPI 的 Swagger UI 页面内部用绝对路径 /openapi.json 拉契约，
    # 只转 /docs 会得到「页面能开、契约拉不到」的空壳文档。
    location = /docs {
        proxy_pass $carmodel_upstream/docs;
    }
    location = /openapi.json {
        proxy_pass $carmodel_upstream/openapi.json;
    }

    # carModel 的 3D 数字孪生驾驶舱（api/main.py 里 app.mount("/cockpit", StaticFiles(html=True))）
    location ^~ /cockpit {
        proxy_pass $carmodel_upstream$request_uri;
    }

    # carModel 引擎健康探针。
    # 这里【不能】复用根路径 /health —— Guardian 和 carModel 两个服务都各自暴露了
    # /health，同一个 origin 下只能给其中一个。根 /health 归 Guardian（见上），
    # carModel 的健康检查因此单独开一个不冲突的路径。
    location = /carmodel/health {
        proxy_pass $carmodel_upstream/health;
    }

    # ================================================
    # 3) 静态资源与 SPA fallback
    # ================================================

    # Vite 产物的 assets/ 文件名带内容 hash，可长期强缓存
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不能缓存：否则用户拿着旧 HTML 去引用已被删除的 hash 资源，
    # 表现为「发版后白屏，刷新才好」。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # SPA 深链兜底：/knowledge、/life、/soul 等前端路由直接回车访问时，
    # 磁盘上并没有对应文件，必须回 index.html 交给 React Router 处理。
    # 这条必须放在最后 —— 它是 catch-all。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
