# ====================================================
# CarSoul Guardian - Docker Compose
# Run:  docker compose up --build
# ====================================================
version: "3.9"

services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: carsoul_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carsoul
      POSTGRES_PASSWORD: carsoul
      POSTGRES_DB: carsoul_guardian
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carsoul -d carsoul_guardian"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: carsoul_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # ---------- Backend (FastAPI) ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: carsoul_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://carsoul:carsoul@postgres:5432/carsoul_guardian
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - ./ai-agent:/app/ai-agent

  # ---------- Frontend (Vite dev server / preview) ----------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: carsoul_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
