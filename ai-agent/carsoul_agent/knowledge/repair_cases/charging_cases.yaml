# 充电系统维修案例 — Repair Cases for Charging System

- id: RC-CHG-001
  symptom: 慢充正常但快充无法启动
  system: charging
  root_cause: 快充继电器故障 / 高压接触器粘连 / 快充协议不匹配
  recommended_action: 快充继电器检测 + 接触器检查 + 充电协议兼容性确认
